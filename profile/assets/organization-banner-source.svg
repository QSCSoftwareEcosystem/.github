<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Science Center Software Ecosystem</title>
  <desc id="desc">Connected software for reproducible quantum science, spanning methods, compilation, simulation, delivery, and knowledge.</desc>

  <rect width="1600" height="400" fill="#f4f1e9"/>
  <path d="M0 0H1090L1010 400H0Z" fill="#101d2d"/>
  <rect width="14" height="400" fill="#ae1935"/>

  <g opacity="0.13" fill="none" stroke="#a9c8dc">
    <circle cx="880" cy="84" r="170"/>
    <circle cx="880" cy="84" r="118"/>
    <path d="M710 84H1050M880-86V254"/>
  </g>

  <g font-family="Aptos, Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="82" y="92" fill="#a9c8dc" font-size="20" font-weight="700" letter-spacing="3.2">QUANTUM SCIENCE CENTER  ·  SOFTWARE</text>
    <text x="78" y="210" fill="#fffdf8" font-size="86" font-weight="750" letter-spacing="-2">Software Ecosystem</text>
    <rect x="82" y="232" width="82" height="6" rx="3" fill="#ae1935"/>
    <text x="82" y="290" fill="#fffdf8" font-size="31" font-weight="450">Connected tools for reproducible quantum science</text>
    <text x="82" y="352" fill="#a9c8dc" font-size="16" font-weight="700" letter-spacing="2.2">10 PUBLIC REPOSITORIES  ·  ONE COORDINATED PORTFOLIO</text>
  </g>

  <image href="qsc-logo.png" x="1210" y="64" width="300" height="100" preserveAspectRatio="xMidYMid meet"/>

  <g font-family="Aptos, Avenir Next, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <path d="M1140 282H1242M1388 282H1490" stroke="#306a91" stroke-width="3"/>
    <path d="M1230 274L1244 282L1230 290M1478 274L1492 282L1478 290" fill="none" stroke="#306a91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="1090" cy="282" r="50" fill="#fffdf8" stroke="#101d2d" stroke-width="3"/>
    <circle cx="1315" cy="282" r="72" fill="#ae1935"/>
    <circle cx="1540" cy="282" r="50" fill="#fffdf8" stroke="#101d2d" stroke-width="3"/>

    <text x="1090" y="278" fill="#101d2d" font-size="19" font-weight="750">PROJECTS</text>
    <text x="1090" y="301" fill="#306a91" font-size="13" font-weight="700" letter-spacing="1.1">SPECIALIZE</text>
    <text x="1315" y="276" fill="#fffdf8" font-size="19" font-weight="750">SOFTWARE</text>
    <text x="1315" y="300" fill="#fffdf8" font-size="14" font-weight="700" letter-spacing="1.2">ECOSYSTEM</text>
    <text x="1540" y="278" fill="#101d2d" font-size="19" font-weight="750">SCIENCE</text>
    <text x="1540" y="301" fill="#306a91" font-size="13" font-weight="700" letter-spacing="1.1">CONNECTS</text>
  </g>
